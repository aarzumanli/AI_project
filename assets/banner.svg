<linearGradient id="tx" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#C4B5FD"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
